<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noordster Jarvis</title>
<style>
:root{--bg:#070918;--panel:#10142c;--line:rgba(150,160,255,.18);--fg:#eef0fc;--dim:#a1a7cc;--gold:#f3b75f;--bad:#ff7a6b;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:radial-gradient(900px 520px at 40% -8%,rgba(243,183,95,.14),transparent 70%),var(--bg);color:var(--fg);font:15px/1.55 system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
h1{margin:0;font:600 18px/1 Georgia,serif;letter-spacing:.38em;text-transform:uppercase}
#tally{margin-left:auto;color:var(--dim);font-size:12px}
main{overflow-y:auto;padding:20px 18px}#log{max-width:820px;margin:0 auto;display:grid;gap:18px}
.u{justify-self:end;background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 4px 14px;padding:9px 14px;max-width:80%;white-space:pre-wrap}
.a{white-space:pre-wrap;overflow-wrap:anywhere}.m{font:500 11px ui-monospace,monospace;color:var(--dim);letter-spacing:.06em;margin-bottom:4px}
.e{color:var(--bad)}
form{display:flex;gap:8px;padding:12px 18px 16px;max-width:856px;width:100%;margin:0 auto}
textarea{flex:1;min-width:0;resize:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:inherit;padding:10px 14px;font:inherit}
button{background:var(--gold);border:0;border-radius:12px;color:#1a1405;font:600 13px ui-monospace,monospace;padding:0 18px;cursor:pointer}
button:disabled{opacity:.5}
</style></head><body>
<header><h1>Noordster</h1><span id="tally"></span></header>
<main><div id="log"><div class="a m">Jarvis v0. Alleen lezen. Typ een vraag.</div></div></main>
<form id="f"><textarea id="t" rows="2" placeholder="Zeg wat er is, of vraag iets" autofocus></textarea><button id="b">Verstuur</button></form>
<script>
var TOKEN="__TOKEN__",log=document.getElementById("log"),t=document.getElementById("t"),b=document.getElementById("b"),tl={};
function el(c,x){var d=document.createElement("div");d.className=c;d.textContent=x||"";return d}
function tel(n){tl[n]=(tl[n]||0)+1;document.getElementById("tally").textContent=Object.keys(tl).map(function(k){return tl[k]+" "+k.toLowerCase()}).join(" · ")}
async function vraag(tekst){
  log.appendChild(el("u",tekst));var m=el("m","…"),a=el("a");var w=document.createElement("div");w.appendChild(m);w.appendChild(a);log.appendChild(w);
  var r=await fetch("/api/vraag",{method:"POST",headers:{"content-type":"application/json","x-jarvis-token":TOKEN},body:JSON.stringify({tekst:tekst})});
  if(!r.ok){a.className="a e";a.textContent="Mislukt ("+r.status+")";return}
  var rd=r.body.getReader(),dc=new TextDecoder(),buf="";
  for(;;){var x=await rd.read();if(x.done)break;buf+=dc.decode(x.value,{stream:true});var p=buf.split("\n\n");buf=p.pop();
    p.forEach(function(blok){var ev=(blok.match(/^event: (.*)$/m)||[])[1],d=JSON.parse((blok.match(/^data: (.*)$/m)||[,"{}"])[1]);
      if(ev==="route"){m.textContent=d.label+" · "+d.model;tel(d.label.split(" · ")[0])}
      else if(ev==="tekst")a.textContent+=(a.textContent?"\n\n":"")+d.tekst;
      else if(ev==="klaar"&&d.klaar.kosten_usd!=null)m.textContent+=" · $"+d.klaar.kosten_usd.toFixed(3);
      else if(ev==="fout"){a.className="a e";a.textContent=d.tekst}})}
  window.scrollTo(0,document.body.scrollHeight);document.querySelector("main").scrollTop=1e9;
}
document.getElementById("f").addEventListener("submit",async function(e){e.preventDefault();var v=t.value.trim();if(!v)return;t.value="";b.disabled=true;try{await vraag(v)}finally{b.disabled=false;t.focus()}});
t.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();document.getElementById("f").requestSubmit()}});
</script></body></html>
